<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHX LAUNCHER</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: #0c0c0c; 
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                        url('https://cdn.discordapp.com/attachments/1347358697051001056/1466392781743329373/Novo_elemento_1_CBEDAB2.gif?ex=6a25fcf3&is=6a24ab73&hm=7d4da4342c5e01a7f5ce711106b4c1740c0cf5a0f25bf82021189f49e0629932&') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* Permite rolar a página para ver o rodapé profissional */
        }

        /* --- HEADER / MENU --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .logo {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            height: 32px; 
            width: auto;
            object-fit: contain;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #bbb;
            font-size: 0.85rem;
            font-weight: 700;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: #ff8833; 
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .social-icon {
            color: #fff;
            font-size: 1.2rem;
            transition: color 0.3s;
        }

        .social-icon:hover {
            color: #ff6600;
        }

        .btn-entrar {
            text-decoration: none;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            transition: all 0.3s;
        }

        .btn-entrar:hover {
            background: #ff6600;
            border-color: #ff6600;
        }

        /* --- CONTEÚDO PRINCIPAL (HERO) --- */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1; /* Ocupa o espaço restante entre o header e o footer */
            text-align: center;
            padding: 60px 20px;
        }

        .hero-content h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .subtitle {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ddd;
            letter-spacing: 1px;
            margin-bottom: 35px;
        }

        .btn-download {
            display: inline-block;
            text-decoration: none;
            background: rgba(255, 102, 0, 0.2); 
            color: #fff;
            padding: 16px 65px;
            font-size: 1.2rem;
            font-weight: 700;
            border: 2px solid #ff6600; 
            border-radius: 8px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.25);
        }

        .btn-download:hover {
            background: #ff6600;
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.6);
            transform: translateY(-2px);
        }

        .os-info {
            display: block;
            font-size: 0.75rem;
            color: #bbb;
            margin-top: 12px;
            font-weight: 700;
        }

        /* --- CARDS DE ESTATÍSTICAS --- */
        .stats-container {
            display: flex;
            gap: 30px;
            margin-top: 60px;
            width: 100%;
            max-width: 900px;
            justify-content: center;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 22px 30px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            flex: 1;
            max-width: 260px;
            transition: transform 0.3s, border-color 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 102, 0, 0.5); 
        }

        .stat-card h3 {
            font-size: 0.75rem;
            color: #ccc;
            letter-spacing: 0.5px;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .stat-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ff6600; 
        }

        /* --- FOOTER PROFISSIONAL --- */
        footer {
            background: #000000;
            padding: 30px 50px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .footer-socials {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .footer-socials a {
            color: #888;
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        .footer-socials a:hover {
            color: #ff6600; /* Destaque laranja nos ícones inferiores */
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: #666;
            font-weight: 700;
        }

        .footer-logo {
            height: 18px;
            width: auto;
            opacity: 0.5;
        }

        .footer-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #888;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 700;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: #fff;
        }

        .footer-disclaimer {
            font-size: 0.75rem;
            color: #555;
            font-weight: 700;
        }

        /* Responsividade básica para o rodapé */
        @media (max-width: 900px) {
            .footer-bottom {
                flex-direction: column;
                text-align: center;
            }
            .footer-links {
                justify-content: center;
            }
        }
    </style>
</head>

            <a href="https://www.instagram.com/kultzzx_r.s?igsh=MTVhZm14MDRxdDRtbQ==" target="_blank"><i class="fab fa-instagram"></i></a>

</body>
