<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: #0c0c0c; 
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                        url('https://cdn.discordapp.com/attachments/1347358697051001056/1466392781743329373/Novo_elemento_1_CBEDAB2.gif?ex=6a25fcf3&is=6a24bg73&hm=7d4da4342c5e01a7f5ce711106b4c1740c0cf5a0f25bf82021189f49e0629932&') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-y: auto; 
            position: relative;
        }

        /* --- EFEITO DE NEVE EM CSS --- */
        .snow-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        /* Configuração das variações de tamanho, posição e velocidade da neve */
        .snowflake:nth-child(1) { left: 10%; width: 4px; height: 4px; animation-duration: 8s; animation-delay: 0s; }
        .snowflake:nth-child(2) { left: 20%; width: 6px; height: 6px; animation-duration: 11s; animation-delay: 1s; opacity: 0.5; }
        .snowflake:nth-child(3) { left: 30%; width: 3px; height: 3px; animation-duration: 9s; animation-delay: 3s; }
        .snowflake:nth-child(4) { left: 40%; width: 5px; height: 5px; animation-duration: 13s; animation-delay: 2s; }
        .snowflake:nth-child(5) { left: 50%; width: 4px; height: 4px; animation-duration: 7s; animation-delay: 4s; }
        .snowflake:nth-child(6) { left: 60%; width: 7px; height: 7px; animation-duration: 12s; animation-delay: 0.5s; opacity: 0.4; }
        .snowflake:nth-child(7) { left: 70%; width: 3px; height: 3px; animation-duration: 10s; animation-delay: 2.5s; }
        .snowflake:nth-child(8) { left: 80%; width: 6px; height: 6px; animation-duration: 14s; animation-delay: 1.5s; }
        .snowflake:nth-child(9) { left: 90%; width: 4px; height: 4px; animation-duration: 9s; animation-delay: 5s; }
        .snowflake:nth-child(10) { left: 95%; width: 5px; height: 5px; animation-duration: 11s; animation-delay: 3.5s; }
        .snowflake:nth-child(11) { left: 15%; width: 5px; height: 5px; animation-duration: 10s; animation-delay: 6s; }
        .snowflake:nth-child(12) { left: 25%; width: 3px; height: 3px; animation-duration: 8s; animation-delay: 7s; }
        .snowflake:nth-child(13) { left: 45%; width: 6px; height: 6px; animation-duration: 12s; animation-delay: 5.5s; }
        .snowflake:nth-child(14) { left: 65%; width: 4px; height: 4px; animation-duration: 9s; animation-delay: 6.5s; }
        .snowflake:nth-child(15) { left: 85%; width: 5px; height: 5px; animation-duration: 13s; animation-delay: 4.8s; }

        @keyframes fall {
            0% { top: -10px; transform: translateX(0); }
            50% { transform: translateX(20px); }
            100% { top: 100vh; transform: translateX(-10px); }
        }

        /* --- HEADER / MENU --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: relative;
            z-index: 10;
        }

        .logo {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            height: 32px; 
            width: auto;
            object-fit: contain;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #bbb;
            font-size: 0.85rem;
            font-weight: 700;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: #ff8833; 
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-entrar {
            text-decoration: none;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            transition: all 0.3s;
        }

        .btn-entrar:hover {
            background: #ff6600;
            border-color: #ff6600;
        }

        /* --- CONTEÚDO PRINCIPAL (HERO) --- */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1; 
            text-align: center;
            padding: 60px 20px;
            position: relative;
            z-index: 10;
        }

        .hero-content h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .subtitle {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ddd;
            letter-spacing: 1px;
            margin-bottom: 35px;
        }

        .btn-download {
            display: inline-block;
            text-decoration: none;
            background: rgba(255, 102, 0, 0.2); 
            color: #fff;
            padding: 16px 65px;
            font-size: 1.2rem;
            font-weight: 700;
            border: 2px solid #ff6600; 
            border-radius: 8px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.25);
            cursor: pointer;
        }

        .btn-download:hover {
            background: #ff6600;
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.6);
            transform: translateY(-2px);
        }

        .os-info {
            display: block;
            font-size: 0.75rem;
            color: #bbb;
            margin-top: 12px;
            font-weight: 700;
        }

        /* --- FOOTER PROFISSIONAL --- */
        footer {
            background: #000000;
            padding: 30px 50px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 10;
        }

        .footer-socials {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .footer-socials a {
            color: #888;
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        .footer-socials a:hover {
            color: #ff6600; 
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: #666;
            font-weight: 700;
        }

        .footer-logo {
            height: 18px;
            width: auto;
            opacity: 0.5;
        }

        .footer-disclaimer {
            font-size: 0.75rem;
            color: #555;
            font-weight: 700;
        }

        @media (max-width: 900px) {
            .footer-bottom {
                flex-direction: column;
                text-align: center;
            }
        }
